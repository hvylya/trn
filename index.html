<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зал на двох</title>
<meta name="theme-color" content="#2e3440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Зал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="program.js"></script>
<script src="bodymap.js"></script>
<script src="badges.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register("sw.js").then(reg => reg.update().catch(() => {})).catch(() => {});
  });
  // нова версія активувалась — перезавантажуємо, дані тренувань не зачіпаються
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return; reloading = true; location.reload();
  });
}
</script>
</body>
</html>
